<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman's Birthday ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #08070b;
            color: #fff7e8;
            font-family: Georgia, "Times New Roman", serif;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 650px;
        }

        .small {
            color: #aaa4ad;
            letter-spacing: 4px;
            font-size: 14px;
            line-height: 1.7;
        }

        h1 {
            font-size: 90px;
            font-weight: normal;
            margin: 35px 0;
        }

        .subtitle {
            color: #e7c98a;
            font-size: 22px;
            margin-bottom: 55px;
        }

        #startButton {
            border: 1px solid #e7c98a;
            background: transparent;
            color: #fff7e8;
            border-radius: 50px;
            padding: 18px 35px;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
        }

        #startButton:active {
            transform: scale(0.97);
        }

        #secondScreen {
            display: none;
        }

        #secondScreen h2 {
            font-size: 45px;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <section id="firstScreen" class="screen">

        <div class="content">

            <p class="small">
                SOMEONE VERY SPECIAL HAS A BIRTHDAY TODAY...
            </p>

            <h1>Aman</h1>

            <p class="subtitle">
                I made something just for you.
            </p>

            <button id="startButton">
                Begin the Surprise ♡
            </button>

        </div>

    </section>


    <section id="secondScreen" class="screen">

    <div class="content">

        <p class="small">
            STEP 01
        </p>

        <h2>
            The surprise has begun ✨
        </h2>

        <button id="continueButton">
            Continue ♡
        </button>

    </div>

</section>

<section id="thirdScreen" class="screen">

    <div class="content">

        <p class="small">
            STEP 02
        </p>

        <h2>
            A little something for you ❤️
        </h2>
<button id="photoButton">
    Continue ♡
</button>
        
    </div>

</section>
    <section id="fourthScreen" class="screen">
    <div class="content">

        <p class="small">
            STEP 03
        </p>

        <h2>
            Some memories, just for us ❤️
        </h2>

    </div>
    </section>
<script>

document.getElementById("startButton").addEventListener("click", function () {

    document.getElementById("firstScreen").style.display = "none";

    document.getElementById("secondScreen").style.display = "flex";

});


document.getElementById("continueButton").addEventListener("click", function () {

    document.getElementById("secondScreen").style.display = "none";

    document.getElementById("thirdScreen").style.display = "flex";

});
document.getElementById("photoButton").addEventListener("click", function () {
    document.getElementById("thirdScreen").style.display = "none";
    document.getElementById("fourthScreen").style.display = "flex";
});
</script>

</body>
</html>
